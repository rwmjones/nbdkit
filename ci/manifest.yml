projects:
  - nbdkit

gitlab:
  namespace: nbdkit
  project: nbdkit
  jobs:
    check-dco: false

targets:
  almalinux-9:
    jobs:
      - arch: x86_64
        variables:
          # rustc 1.75.0 < MSRV
          RUST: skip

  almalinux-10: x86_64

  alpine-322:
    jobs:
      - arch: x86_64
        variables:
          # cgo does not play well with musl: https://github.com/golang/go/issues/13492
          GOLANG: skip

  alpine-323:
    jobs:
      - arch: x86_64
        variables:
          # cgo does not play well with musl: https://github.com/golang/go/issues/13492
          GOLANG: skip

  alpine-edge:
    jobs:
      - arch: x86_64
        variables:
          # cgo does not play well with musl: https://github.com/golang/go/issues/13492
          GOLANG: skip

  centos-stream-9: x86_64

  debian-12:
    jobs:
      - arch: x86_64
        variables:
          # rustc 1.63.0 < MSRV
          RUST: skip

  debian-13: x86_64

  debian-sid: x86_64

  fedora-43:
    jobs:
      - arch: x86_64
        variables:
          PERL: force

      - arch: mingw32
        variables:
          RUST: skip
          GOLANG: skip

      - arch: mingw64
        variables:
          RUST: skip
          GOLANG: skip

  fedora-44:
    jobs:
      - arch: x86_64
        variables:
          PERL: force

      - arch: x86_64
        suffix: -clang
        variables:
          CC: clang
          CXX: clang++
          PERL: skip

  fedora-rawhide:
    jobs:
      - arch: x86_64
        variables:
          PERL: force

      - arch: x86_64
        suffix: -clang
        variables:
          CC: clang
          CXX: clang++
          PERL: skip

  opensuse-leap-15: x86_64

  opensuse-leap-16: x86_64

  opensuse-tumbleweed: x86_64

  ubuntu-2404:
    jobs:
      - arch: x86_64
        variables:
          # rustc 1.75.0 < MSRV
          RUST: skip

  ubuntu-2604:
    jobs:
      - arch: x86_64
        variables:
          # rustc 1.75.0 < MSRV
          RUST: skip
